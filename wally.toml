[package]
name = "biotoxin495/gradientkit"
description = "A standalone UIGradient creation and animation utility for Roblox UI, intended to run on the client. GradientKit can create or reuse gradients, apply built-in effects, and return disposable controllers for cleanup. It does not require a UI framework or service container."
version = "1.0.0"
license = "MIT"
authors = ["biotoxin495"]
realm = "shared"
registry = "https://github.com/UpliftGames/wally-index"
repository = "https://github.com/biotoxin495/GradientKit"

exclude = [
	"examples",
	"docs",
	".github",
	"*.rbxl",
	"*.rbxlx",
]